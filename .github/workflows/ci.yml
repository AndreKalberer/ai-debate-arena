name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            debate-ui/package-lock.json
      - run: npm ci
      - run: npm ci --prefix debate-ui
      - name: Test saved history, statistics, and exports (no API keys)
        run: npm test
      - name: Build backend
        run: npm run build
      - name: Build frontend
        run: npm run build --prefix debate-ui
